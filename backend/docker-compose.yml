services:
  db:
    image: postgres:16
    container_name: botica-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: botica
      POSTGRES_PASSWORD: botica
      POSTGRES_DB: botica
    ports:
      # 5434 en tu computadora (5432 y 5433 quedan libres para otros proyectos) -> 5432 dentro del contenedor
      - "5434:5432"
    volumes:
      - botica-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botica -d botica"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  botica-data: